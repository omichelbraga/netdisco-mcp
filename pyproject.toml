[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netdisco-mcp"
version = "0.1.0"
description = "A complete, agent-friendly MCP server generated from the Netdisco Swagger API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Netdisco MCP contributors" }]
dependencies = [
  "fastmcp>=3.3,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
netdisco-mcp = "netdisco_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netdisco_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/netdisco_mcp/data/GUIDANCE.md" = "netdisco_mcp/data/GUIDANCE.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

